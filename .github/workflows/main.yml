name: fastapi CI/CD

on:
  push:
    branches: [main]
    paths-ignore:
      - '.gitignore'
      - '.dockerignore'

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-northeast-2

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set Variables
        id: set-var
        run: |
          echo "ECR_REGISTRY=${{ steps.login-ecr.outputs.registry }}" >> $GITHUB_ENV
          echo "ECR_REPOSITORY=fast" >> $GITHUB_ENV
          echo "IMAGE_TAG=${{ github.run_number }}" >> $GITHUB_ENV
          echo "GIT_EMAIL=dong.hee4881@gmail.com" >> $GITHUB_ENV
          echo "GIT_NAME=Donghee01" >> $GITHUB_ENV

      - name: Docker Image Build
        run: |
          docker build -t ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }} .
          
      - name: Docker image Push
        run: |
          docker push ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}

      - name: Checkout Deployment Repository
        uses: actions/checkout@v4
        with:
          repository: Donghee01/sfapp  # 배포용 레포지토리가 sfapp 인지 확인하세요!
          ref: main
          token: ${{ secrets.GH_TOKEN }}
          
      - name: k8s manifest update
        run: |
          # sed 명령어를 한 줄로 깔끔하게 처리했습니다.
          sed -i "s@image: ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:.*@image: ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}@g" ./fastapi/fastapi.yml

      - name: Commit and Push
        run: |
          git config user.email ${{ env.GIT_EMAIL }}
          git config user.name ${{ env.GIT_NAME }}
          git add ./fastapi/fastapi.yml
          git commit -m "Update image tag to ${{ env.IMAGE_TAG }}"
          git push origin main
